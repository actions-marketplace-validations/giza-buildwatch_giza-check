name: Giza BuildWatch check
description: "Every AI says 'done.' Giza checks: the nine things a real app needs, proven from evidence, shown as a pyramid on every run."
author: giza-buildwatch
branding:
  icon: triangle
  color: orange
inputs:
  repo:
    description: "The project to check, as owner/repo. Defaults to this repository."
    required: false
    default: ${{ github.repository }}
  token:
    description: "Token used to read GitHub (read-only use). Defaults to this workflow's token."
    required: false
    default: ${{ github.token }}
  strict:
    description: "Set to 'true' to fail the run when Giza finds a problem (for example a committed .env file)."
    required: false
    default: "false"
outputs:
  built:
    description: "How many of the nine blocks Giza proved."
    value: ${{ steps.check.outputs.built }}
runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        GIZA_REPO: ${{ inputs.repo }}
        GIZA_STRICT: ${{ inputs.strict }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        set -o pipefail
        flags=""; [ "$GIZA_STRICT" = "true" ] && flags="--strict"
        node "$GITHUB_ACTION_PATH/giza-check.mjs" "$GIZA_REPO" --json > "$RUNNER_TEMP/giza.json" || code=$?
        node "$GITHUB_ACTION_PATH/giza-check.mjs" "$GIZA_REPO" $flags > "$RUNNER_TEMP/giza.txt" || code=${code:-$?}
        cat "$RUNNER_TEMP/giza.txt"
        built=$(node -e 'try{const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(String(r.built??""))}catch{}' "$RUNNER_TEMP/giza.json")
        echo "built=$built" >> "$GITHUB_OUTPUT"
        {
          echo "## Giza BuildWatch"
          echo
          echo '```text'
          sed 's/```/` ` `/g' "$RUNNER_TEMP/giza.txt"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        exit ${code:-0}
